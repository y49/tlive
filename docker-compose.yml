# TLive v1.0 — Bridge-only (pure Node, no Go Core)
#
# Production:  docker compose up -d
# Local test:  docker compose --env-file .env.local up
#
# Copy config.env.example to .env and fill in your tokens.

services:
  bridge:
    build:
      context: ./bridge
    ports:
      - "${TL_PORT:-8849}:8849"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - TL_TOKEN=${TL_TOKEN}
      - TL_PORT=8849
      - TL_PUBLIC_URL=${TL_PUBLIC_URL:-}
      - TL_ENABLED_CHANNELS=${TL_ENABLED_CHANNELS:-}
      - TL_RUNTIME=${TL_RUNTIME:-claude}
      - TL_DEFAULT_WORKDIR=${TL_DEFAULT_WORKDIR:-/workspace}
      # Telegram
      - TL_TG_BOT_TOKEN=${TL_TG_BOT_TOKEN:-}
      - TL_TG_CHAT_ID=${TL_TG_CHAT_ID:-}
      - TL_TG_ALLOWED_USERS=${TL_TG_ALLOWED_USERS:-}
      - TL_TG_REQUIRE_MENTION=${TL_TG_REQUIRE_MENTION:-true}
      - TL_TG_DISABLE_LINK_PREVIEW=${TL_TG_DISABLE_LINK_PREVIEW:-true}
      # Discord
      - TL_DC_BOT_TOKEN=${TL_DC_BOT_TOKEN:-}
      - TL_DC_ALLOWED_USERS=${TL_DC_ALLOWED_USERS:-}
      - TL_DC_ALLOWED_CHANNELS=${TL_DC_ALLOWED_CHANNELS:-}
      # Feishu
      - TL_FS_APP_ID=${TL_FS_APP_ID:-}
      - TL_FS_APP_SECRET=${TL_FS_APP_SECRET:-}
      - TL_FS_ALLOWED_USERS=${TL_FS_ALLOWED_USERS:-}
      - TL_FS_VERIFICATION_TOKEN=${TL_FS_VERIFICATION_TOKEN:-}
      - TL_FS_ENCRYPT_KEY=${TL_FS_ENCRYPT_KEY:-}
      - TL_FS_WEBHOOK_PORT=${TL_FS_WEBHOOK_PORT:-9100}
      # Provider API keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    volumes:
      - tlive-data:/root/.tlive

volumes:
  tlive-data:
