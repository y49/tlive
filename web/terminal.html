<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>tlive terminal</title>
  <link rel="stylesheet" href="/terminal.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #viewport { position: absolute; inset: 0 0 44px 0; overflow: hidden; }
    #scaler { position: absolute; top: 0; left: 0; transform-origin: top left; }
    #term { display: inline-block; }
    #hint { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
            max-width: 92%; padding: 4px 10px; border-radius: 8px; background: rgba(20,20,20,.85);
            color: #bbb; font: 12px ui-monospace, Menlo, monospace; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; display: none; pointer-events: none; z-index: 5; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 6px;
           align-items: center; padding: 0 8px; background: #111; overflow-x: auto; }
    #bar button { flex: 0 0 auto; height: 30px; min-width: 42px; border: 1px solid #333; border-radius: 6px;
                  background: #1c1c1c; color: #ddd; font: 13px monospace; }
    #bar button:active { background: #333; }
  </style>
</head>
<body>
  <div id="viewport"><div id="scaler"><div id="term"></div></div></div>
  <div id="hint"></div>
  <div id="bar"></div>
  <script src="/terminal.js"></script>
</body>
</html>
