<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>tlive</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <style>
    :root {
      color-scheme: dark;
      --accent: #35d07f;
      --text: #e8ebf0; --text-2: #9aa4b2; --dim: #6b7482; --faint: #4b525d;
      --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.05);
      --card-top: #131924; --card-bot: #0e131b; --win: #06080c;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: radial-gradient(1100px 640px at 22% -8%, #0e141d 0%, #080b11 52%, #05070b 100%);
           background-attachment: fixed; color: var(--text); font-family: var(--mono);
           -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
    @keyframes tlPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(53,208,127,.5); } 70% { box-shadow: 0 0 0 6px rgba(53,208,127,0); } }
    @keyframes tlBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }

    /* app bar */
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
             padding: calc(15px + env(safe-area-inset-top)) 22px 15px;
             background: linear-gradient(180deg, rgba(17,21,29,.96), rgba(11,14,20,.92));
             backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: tlPulse 2.6s infinite; }
    header .brand { font-size: 18px; font-weight: 800; letter-spacing: -.4px; color: #f4f6fa; }
    #count { font-size: 12px; font-weight: 700; color: var(--text-2); background: rgba(255,255,255,.06);
             border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
    header .sub { font-size: 12px; color: var(--faint); }
    #conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); letter-spacing: .5px; }
    #conn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff5f57; }
    #conn.up { color: var(--accent); } #conn.up::before { background: var(--accent); box-shadow: 0 0 9px var(--accent); }

    #empty { padding: 84px 24px; text-align: center; color: var(--dim); }
    #empty .big { font-size: 40px; margin-bottom: 14px; opacity: .4; }
    #empty code { color: var(--text-2); background: rgba(255,255,255,.05); border: 1px solid var(--line);
                  border-radius: 6px; padding: 2px 8px; }

    /* single wide column (design is a 1100px card) so the desktop preview pane
       is wide enough to render the session grid legibly. 1–2 sessions is typical. */
    #grid { display: grid; gap: 18px; padding: 22px; grid-template-columns: 1fr; max-width: 1160px; margin: 0 auto; }

    /* card */
    .card { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--line);
            background: linear-gradient(180deg, var(--card-top), var(--card-bot));
            box-shadow: 0 20px 44px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05); }
    .card .glow { position: absolute; inset: 0; pointer-events: none;
                  background: radial-gradient(420px 200px at 85% -25%, var(--s-glowbg), transparent 68%); }
    .card .rail { position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0;
                  background: linear-gradient(180deg, var(--s-accent), var(--s-fade)); }
    .card .body { position: relative; display: grid; gap: 15px; padding: 20px 20px 18px 22px;
                  grid-template-columns: 1fr; grid-template-areas: "head" "win" "foot"; }
    .card .head { grid-area: head; } .card .win { grid-area: win; } .card .foot { grid-area: foot; }

    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .name-wrap { min-width: 0; }
    .name-line { display: flex; align-items: center; gap: 10px; }
    .sdot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--s-accent); box-shadow: 0 0 10px var(--s-glow); }
    .sdot.run { animation: tlPulse 2.6s infinite; }
    .name { font-size: 16px; font-weight: 700; color: #eef1f6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: flex; align-items: center; gap: 8px; margin-top: 11px; overflow: hidden; }
    .pid { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: #8b95a3; background: rgba(255,255,255,.05);
           border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 2px 8px; }
    .path { font-size: 12px; color: #5f6875; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .right { flex: 0 0 auto; text-align: right; }
    .pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
            padding: 4px 10px; border-radius: 999px; color: var(--s-pilltext); background: var(--s-pillbg); border: 1px solid var(--s-pillborder); }
    .uptime { margin-top: 10px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

    /* terminal preview window (mac chrome + live xterm inside) */
    .win { border-radius: 13px; overflow: hidden; border: 1px solid rgba(255,255,255,.07); background: var(--win);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.03); cursor: pointer; }
    .win .chrome { display: flex; align-items: center; gap: 8px; padding: 9px 13px;
                   background: rgba(255,255,255,.025); border-bottom: 1px solid var(--line-2); }
    .win .tl { width: 9px; height: 9px; border-radius: 50%; }
    .win .title { margin-left: 6px; font-size: 11px; color: #5b6472; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .win .screen { position: relative; overflow: hidden; }
    .pv-scaler { position: absolute; top: 0; left: 0; transform-origin: top left; }

    /* message / approval block */
    .msg { position: relative; font-size: 12.5px; color: #c7ccd4; background: var(--win); border: 1px solid var(--line);
           border-radius: 11px; padding: 10px 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
    .msg .k { color: var(--dim); } .msg.approval { border-color: #3f1d1d; }
    .msg .d-add { color: #86efac; } .msg .d-del { color: #fca5a5; } .msg .d-hunk { color: #67e8f9; } .msg .d-cmd { color: #fde68a; }

    /* actions */
    /* wrap, never squeeze: flex items shrink below their content width by
       default, and CJK has no spaces to break on — so a row of option buttons
       collapsed into one-character-wide columns. */
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .actions .spring { flex: 1; }
    button { font-family: inherit; cursor: pointer; }
    .icon-btn { flex: 0 0 auto; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
                border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: #8b95a3; }
    .icon-btn:hover { background: rgba(255,255,255,.06); color: var(--text-2); }
    .icon-btn.on { border-color: rgba(255,95,87,.22); background: rgba(255,95,87,.08); color: #ff7b74; }
    .term-btn { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; padding: 11px 22px; border-radius: 11px;
                border: 1px solid rgba(53,208,127,.28); background: rgba(53,208,127,.08); color: #eef1f6; text-decoration: none; }
    .term-btn:hover { background: rgba(53,208,127,.14); }
    .term-btn .g { color: var(--accent); font-weight: 800; }
    .btn { flex: 0 0 auto; max-width: 100%; font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 10px;
           border: 1px solid var(--line-2); background: rgba(255,255,255,.04); color: var(--text); }
    .btn.ok { border-color: rgba(53,208,127,.28); background: rgba(53,208,127,.08); color: #86efac; }
    .btn.no { border-color: rgba(255,95,87,.28); background: rgba(255,95,87,.08); color: #fca5a5; }
    .reply { display: flex; gap: 8px; }
    .reply input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 9px 11px; border-radius: 10px;
                   border: 1px solid var(--line-2); background: var(--win); color: var(--text); }
    .reply input:focus { outline: none; border-color: #3b4a63; }

    @media (min-width: 720px) {
      .card .body { grid-template-columns: 300px 1fr; grid-template-areas: "head win" "foot win"; gap: 22px; align-items: start; }
      .card .foot { align-self: end; }
      .card .win { align-self: start; }
    }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <span class="brand">tlive</span>
    <span id="count">0</span>
    <span class="sub">sessions</span>
    <span id="conn">connecting</span>
  </header>
  <div id="empty">
    <div class="big">◫</div>
    <div>No active sessions</div>
    <p>Run <code>tlive run claude</code> in a project directory to begin</p>
  </div>
  <div id="grid"></div>
  <script src="/dashboard.js"></script>
</body>
</html>
