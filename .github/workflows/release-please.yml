name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  # Pushing to main never publishes. This job only opens/updates a release PR
  # that accumulates unreleased commits; merging that PR is the release button
  # — it tags, cuts the GitHub Release, and unblocks publish-npm below.
  #
  # Manifest mode (config + manifest files) rather than a bare `release-type`:
  # the v2 rewrite landed as an orphan root, so every v0.x tag is unreachable
  # from main and release-please's release lookup finds nothing. Without a
  # version anchor it falls back to its default initial version and proposes a
  # *downgrade* (it never reads package.json). `.release-please-manifest.json`
  # is that anchor, and `prerelease: true` keeps it tracking the beta line.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # tlive is a single pure-Node package (was v1's Go `core/` + `bridge/` — both
  # removed in the v2 rewrite). One job: verify on the release commit, then
  # publish the root package to npm. Prerelease versions (2.0.0-beta.0) go to
  # the matching dist-tag (`beta`), stable to `latest`.
  publish-npm:
    needs: release-please
    # Compare explicitly: a bare `${{ outputs.x }}` gate is truthy for the
    # *string* "false", which would publish on every push to main.
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # prepublishOnly runs `npm run ci` (typecheck + test + build) as the safety net.
          ver=$(node -p "require('./package.json').version")
          case "$ver" in
            *-*) tag="${ver#*-}"; tag="${tag%%.*}" ;; # 2.0.0-beta.0 -> beta
            *)   tag="latest" ;;
          esac
          echo "publishing $ver under dist-tag '$tag'"
          pnpm publish --no-git-checks --provenance --access public --tag "$tag"
