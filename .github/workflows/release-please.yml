name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  # tlive is a single pure-Node package (was v1's Go `core/` + `bridge/` — both
  # removed in the v2 rewrite). One job: verify on the release commit, then
  # publish the root package to npm. Prerelease versions (2.0.0-beta.0) go to
  # the matching dist-tag (`beta`), stable to `latest`.
  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # prepublishOnly runs `npm run ci` (typecheck + test + build) as the safety net.
          ver=$(node -p "require('./package.json').version")
          case "$ver" in
            *-*) tag="${ver#*-}"; tag="${tag%%.*}" ;; # 2.0.0-beta.0 -> beta
            *)   tag="latest" ;;
          esac
          echo "publishing $ver under dist-tag '$tag'"
          pnpm publish --no-git-checks --provenance --access public --tag "$tag"
