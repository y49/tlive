name: Release Please
on:
  push:
    branches: [main]
  # Manual re-publish. release-please cuts the tag and GitHub Release in one job
  # and npm publishes in the next, so a credential or registry failure leaves a
  # released version that never reached npm. Re-running the original run is not
  # a fix: a run replays the workflow file from the commit that triggered it, so
  # an edit to this file can never be applied that way. This is the way in.
  workflow_dispatch:

# Two pushes to main seconds apart — a merge, then the branch deletion that
# follows it — start two runs that race. Real example: 07:09:49 tagged v5.0.1,
# cut the release and published; 07:09:53 found the tag already there, then
# failed removing a label the first run had already removed, leaving a red X on
# a release that had in fact succeeded. A permanently failing release workflow
# is how a real failure goes unnoticed later.
#
# NOT cancel-in-progress. This job tags and cuts the GitHub Release, and the
# next one publishes to npm; cancelling between those leaves a released version
# that never reached the registry — the exact failure the workflow_dispatch
# note above exists to recover from. Queue instead: the second run then sees a
# release PR already marked tagged and does nothing, which is correct.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  # Pushing to main never publishes. This job only opens/updates a release PR
  # that accumulates unreleased commits; merging that PR is the release button
  # — it tags, cuts the GitHub Release, and unblocks publish-npm below.
  #
  # Manifest mode (config + manifest files) rather than a bare `release-type`:
  # the v2 rewrite landed as an orphan root, so every v0.x tag is unreachable
  # from main and release-please's release lookup finds nothing. Without a
  # version anchor it falls back to its default initial version and proposes a
  # *downgrade* (it never reads package.json). `.release-please-manifest.json`
  # is that anchor, and `prerelease: true` keeps it tracking the beta line.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # tlive is a single pure-Node package (was v1's Go `core/` + `bridge/` — both
  # removed in the v2 rewrite). One job: verify on the release commit, then
  # publish the root package to npm. Prerelease versions (2.0.0-beta.0) go to
  # the matching dist-tag (`beta`), stable to `latest`.
  publish-npm:
    needs: release-please
    # Compare explicitly: a bare `${{ outputs.x }}` gate is truthy for the
    # *string* "false", which would publish on every push to main. The manual
    # trigger bypasses the gate on purpose — it exists for the case where the
    # release already happened and only the publish needs retrying. Publishing
    # a version that is already on the registry fails there, not here, which is
    # the safe direction.
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish
        run: |
          # No credential here on purpose: this publishes through npm trusted
          # publishing. pnpm exchanges this workflow's GitHub OIDC id-token for
          # a short-lived npm credential, which is what `id-token: write` above
          # is for. Nothing to rotate and nothing to expire — the previous
          # NPM_TOKEN silently aged out and turned a release into a registry
          # 404 (npm answers 404, not 403, for an unauthorized PUT, so read a
          # 404 here as "not authorized", never as "package missing").
          #
          # The trust is declared on the registry side, not here:
          #   npmjs.com -> tlive -> Settings -> Trusted Publisher -> GitHub Actions
          #   organization/user: y49        repository: tlive
          #   workflow filename: release-please.yml   (the FILE NAME, not a path)
          #   environment: empty           allowed operations: npm publish only
          # Without it pnpm logs `Skipped OIDC: …` and falls through to a
          # credential that no longer exists.
          #
          # prepublishOnly runs `npm run ci` (typecheck + test + build) as the safety net.
          ver=$(node -p "require('./package.json').version")
          case "$ver" in
            *-*) tag="${ver#*-}"; tag="${tag%%.*}" ;; # 2.0.0-beta.0 -> beta
            *)   tag="latest" ;;
          esac
          echo "publishing $ver under dist-tag '$tag'"
          pnpm publish --no-git-checks --provenance --access public --tag "$tag"
